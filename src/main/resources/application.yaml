spring:
  application:
    name: nutrition-recommendation

  datasource:
    driverClassName: org.postgresql.Driver
    url: jdbc:postgresql://localhost:5432/nutrition_db
    username: postgres
    password: ${DB_PASSWORD}

  jpa:
    show-sql: false

  liquibase:
    enabled: true
    drop-first: ${DROP_FIRST:false}
    change-log: classpath:db/database-nutrition-changelog.xml
    default-schema: public

  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
    hiddenmethod:
      filter:
        enabled: true

logging:
   level:
     ru.darin.nutrition_recommendation: info
     org:
       springframework: ${LOG:info}
   file:
     name:
       logs/log

nutrition-recommendation:
  openapi:
    dev-url: http://localhost:8080